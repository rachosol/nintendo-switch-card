<svg xmlns="http://www.w3.org/2000/svg" width="984" height="738" viewBox="0 0 492 369" role="img" aria-labelledby="title desc">
  <title id="title">Nintendo Switch Card en Home Assistant</title>
  <desc id="desc">Tarjeta oscura de Home Assistant con estado de carga, batería, Nintendo Switch y cuatro métricas. No incluye controles ni menú.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e2e"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="joyLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#f2f4f5"/>
      <stop offset="1" stop-color="#cbd0d3"/>
    </linearGradient>
    <linearGradient id="joyRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#f2f4f5"/>
      <stop offset="1" stop-color="#cbd0d3"/>
    </linearGradient>
    <radialGradient id="control" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#5e5e5e"/>
      <stop offset="1" stop-color="#101010"/>
    </radialGradient>
  </defs>

  <rect x=".5" y=".5" width="491" height="368" rx="12" fill="#1c1c1c" stroke="#3d3d3d"/>

  <!-- Encabezado: exactamente dos indicadores en la tarjeta real. -->
  <g fill="#a5a5a5" font-family="Roboto, Arial, sans-serif" font-size="14">
    <g transform="translate(16 13)" stroke="#a5a5a5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M5 1v7M10 1v7M3 8h9v4a5 5 0 0 1-5 5 5 5 0 0 1-4-2"/>
      <path d="M8 17l7 7"/>
      <path d="M2 2l17 17"/>
    </g>
    <text x="40" y="27">Sin carga</text>
    <g transform="translate(438 13)" fill="none" stroke="#a5a5a5" stroke-width="2">
      <rect x="0" y="2" width="12" height="19" rx="1.5"/>
      <path d="M4 0h4"/>
      <path d="M4 6h4v11H4z" fill="#a5a5a5" stroke="none"/>
    </g>
    <text x="456" y="27">72%</text>
  </g>

  <!-- Ilustración predeterminada de la consola. -->
  <g transform="translate(12 46) scale(.78)">
    <ellipse cx="300" cy="194" rx="270" ry="5" fill="#000" opacity=".28"/>
    <path d="M22 14Q4 14 4 36v128q0 22 18 22h38V14z" fill="url(#joyLeft)" stroke="#b9c0c4" stroke-width="1.2"/>
    <circle cx="22" cy="42" r="11" fill="url(#control)"/><circle cx="22" cy="42" r="8" fill="#0a0a0a"/>
    <circle cx="32" cy="86" r="5" fill="url(#control)"/><circle cx="32" cy="116" r="5" fill="url(#control)"/>
    <circle cx="18" cy="101" r="5" fill="url(#control)"/><circle cx="46" cy="101" r="5" fill="url(#control)"/>
    <rect x="44" y="38" width="9" height="2" rx="1" fill="#9aa2a6"/><rect x="42" y="148" width="9" height="9" rx="1.5" fill="url(#control)"/>
    <rect x="60" y="14" width="3" height="172" fill="#000" opacity=".55"/>
    <rect x="63" y="6" width="474" height="188" rx="10" fill="url(#body)"/>
    <rect x="71" y="20" width="458" height="160" rx="4" fill="#040404"/><rect x="79" y="26" width="442" height="148" rx="2" fill="#0c0c0c"/>
    <rect x="294" y="190" width="14" height="2" rx="1" fill="#000" opacity=".7"/>
    <rect x="537" y="14" width="3" height="172" fill="#000" opacity=".55"/>
    <path d="M540 14v172h38q18 0 18-22V36q0-22-18-22z" fill="url(#joyRight)" stroke="#b9c0c4" stroke-width="1.2"/>
    <circle cx="572" cy="42" r="6" fill="url(#control)"/><circle cx="586" cy="56" r="6" fill="url(#control)"/>
    <circle cx="558" cy="56" r="6" fill="url(#control)"/><circle cx="572" cy="70" r="6" fill="url(#control)"/>
    <g fill="#aaa" font-family="Arial" font-weight="700" font-size="7" text-anchor="middle"><text x="572" y="45">X</text><text x="586" y="59">A</text><text x="558" y="59">Y</text><text x="572" y="73">B</text></g>
    <circle cx="578" cy="138" r="11" fill="url(#control)"/><circle cx="578" cy="138" r="8" fill="#0a0a0a"/>
    <g stroke="#5d666b" stroke-width="2" stroke-linecap="round"><path d="M548 38h8M552 34v8"/></g>
    <circle cx="552" cy="158" r="5" fill="#0a0a0a"/><circle cx="552" cy="158" r="4.5" fill="none" stroke="#aaa" stroke-width=".6" opacity=".4"/>
  </g>

  <g font-family="Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="246" y="245" fill="#e1e1e1" font-size="20" font-weight="600">Nintendo Switch</text>
    <text x="246" y="266" fill="#a5a5a5" font-size="14">Sin juego en ejecución</text>
  </g>

  <!-- Métricas; no hay barra de acciones bajo ellas. -->
  <path d="M1 286.5h490M123 287v81M246 287v81M369 287v81" stroke="#3d3d3d"/>
  <g font-family="Roboto, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(61.5 0)"><text y="325" fill="#e1e1e1" font-size="20" font-weight="500">3.88 V</text><text y="344" fill="#a5a5a5" font-size="12">Voltaje</text></g>
    <g transform="translate(184.5 0)"><text y="325" fill="#e1e1e1" font-size="20" font-weight="500">33.5 °C</text><text y="344" fill="#a5a5a5" font-size="12">Temperatura</text></g>
    <g transform="translate(307.5 0)"><text y="325" fill="#e1e1e1" font-size="20" font-weight="500">105 %</text><text y="344" fill="#a5a5a5" font-size="12">Salud</text></g>
    <g transform="translate(430.5 0)"><text y="325" fill="#e1e1e1" font-size="20" font-weight="500">4550</text><text y="344" fill="#a5a5a5" font-size="12">Telemetría</text></g>
  </g>
</svg>
